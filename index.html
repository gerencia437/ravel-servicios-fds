<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1e40af" />
  <title>Ravel · Servicios Fin de Semana</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    .hidden { display: none !important; }
    .input { width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #d1d5db; border-radius: 0.5rem; outline: none; }
    .input:focus { border-color: #1e40af; box-shadow: 0 0 0 2px rgba(30, 64, 175, 0.2); }
    .input:disabled { background: #f9fafb; color: #6b7280; }
    .label { display: block; font-size: 0.7rem; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem; }
    .btn { padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 500; transition: all 0.15s; cursor: pointer; border: none; font-size: 0.875rem; }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #1e40af; color: white; }
    .btn-primary:hover { background: #1e3a8a; }
    .btn-ok { background: #15803d; color: white; }
    .btn-ok:hover { background: #166534; }
    .btn-err { background: #b91c1c; color: white; }
    .btn-err:hover { background: #991b1b; }
    .btn-ghost { background: white; color: #374151; border: 1px solid #d1d5db; }
    .btn-ghost:hover { background: #f9fafb; }
    .card { background: white; border-radius: 0.75rem; border: 1px solid #e5e7eb; padding: 1rem; }
    .badge { display: inline-block; padding: 0.125rem 0.5rem; border-radius: 0.25rem; font-size: 0.75rem; font-weight: 500; }
    .nav-link { padding: 0.5rem 0.75rem; border-radius: 0.5rem; font-size: 0.875rem; font-weight: 500; color: #4b5563; cursor: pointer; white-space: nowrap; background: transparent; border: none; }
    .nav-link:hover { background: #f3f4f6; }
    .nav-link.active { background: #1e40af; color: white; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <div id="view-login" class="min-h-screen flex items-center justify-center p-4">
    <div class="card w-full max-w-sm">
      <div class="text-center mb-6">
        <div class="text-2xl font-bold text-blue-800">Transporte Ravel</div>
        <div class="text-sm text-gray-500 mt-1">Servicios fin de semana</div>
      </div>
      <div class="space-y-3">
        <div>
          <label class="label">Cédula</label>
          <input id="input-cedula" type="text" inputmode="numeric" class="input" placeholder="Ej: 71234567" autofocus />
        </div>
        <div id="login-error" class="text-sm text-red-700 hidden"></div>
        <button id="btn-login" class="btn btn-primary w-full">Ingresar</button>
        <div class="text-xs text-gray-400 text-center pt-2">
          Si es tu primera vez, contacta al administrador.
        </div>
      </div>
    </div>
  </div>

  <div id="view-main" class="hidden">
    <header class="bg-white border-b sticky top-0 z-10">
      <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
        <div>
          <div class="font-bold text-blue-800">Ravel</div>
          <div class="text-xs text-gray-500">Servicios fin de semana</div>
        </div>
        <div class="flex items-center gap-2">
          <div class="text-right hidden sm:block">
            <div id="header-nombre" class="text-sm font-medium"></div>
            <div id="header-rol" class="text-xs text-gray-500 capitalize"></div>
          </div>
          <button id="btn-logout" class="btn btn-ghost text-sm">Salir</button>
        </div>
      </div>
      <nav id="nav-tabs" class="max-w-5xl mx-auto px-4 pb-2 flex gap-1 overflow-x-auto"></nav>
    </header>
    <main class="max-w-5xl mx-auto p-4">
      <div id="content"></div>
    </main>
  </div>

  <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl max-w-md w-full max-h-[90vh] overflow-y-auto p-5">
      <div id="modal-content"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
    import {
      getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc,
      updateDoc, deleteDoc, query, where, orderBy, onSnapshot, serverTimestamp
    } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyAmfFabMCKEDvZNdpIYA_HpIMAurpT_izg",
      authDomain: "transporte-ravel.firebaseapp.com",
      projectId: "transporte-ravel",
      storageBucket: "transporte-ravel.appspot.com",
      messagingSenderId: "349820780179",
      appId: "1:349820780179:web:e330d14a09d44f63019766"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const estado = {
      usuario: null, vista: 'lista',
      planillaEditando: null,
      vehiculos: [], planillas: [], usuarios: [], clientes: [],
      filtroEstado: 'por_aprobar',
      dashDesde: '', dashHasta: '',
      repPlaca: '__ALL__', repDesde: '', repHasta: '',
      unsubPlanillas: null, unsubVehiculos: null, unsubUsuarios: null, unsubClientes: null
    };

    const $ = (id) => document.getElementById(id);
    const uuid = () => 'i_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    const aMin = (h) => { if (!h) return null; const [hh, mm] = h.split(':').map(Number); return hh * 60 + mm; };
    const diffMin = (ini, fin) => {
      const a = aMin(ini), b = aMin(fin);
      if (a == null || b == null) return null;
      let d = b - a; if (d < 0) d += 1440; return d;
    };
    const fmtMin = (m) => {
      if (m == null) return '—';
      const h = Math.floor(m / 60), mm = m % 60;
      if (h === 0) return `${mm} min`;
      if (mm === 0) return `${h}h`;
      return `${h}h ${mm}min`;
    };
    const diaSemana = (iso) => {
      if (!iso) return '';
      const d = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
      const [y,m,dd] = iso.split('-').map(Number);
      return d[new Date(y, m-1, dd).getDay()];
    };
    const fechaHoy = () => new Date().toISOString().slice(0,10);
    const fechaHaceDias = (n) => { const d = new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); };
    const esc = (s) => s == null ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    const ESTADOS = {
      en_curso:    { txt: 'En curso',    cls: 'bg-blue-100 text-blue-700' },
      por_aprobar: { txt: 'Por aprobar', cls: 'bg-amber-100 text-amber-700' },
      aprobado:    { txt: 'Aprobado',    cls: 'bg-green-100 text-green-700' },
      rechazado:   { txt: 'Rechazado',   cls: 'bg-red-100 text-red-700' },
      cancelado:   { txt: 'Cancelado',   cls: 'bg-gray-200 text-gray-600' }
    };
    const badgeEstado = (e) => { const x = ESTADOS[e] || ESTADOS.en_curso; return `<span class="badge ${x.cls}">${x.txt}</span>`; };

    const ESTADOS_INTERV = {
      pendiente: { txt: 'Pendiente', cls: 'bg-gray-100 text-gray-700' },
      ok: { txt: 'OK', cls: 'bg-green-100 text-green-700' },
      rechazada: { txt: 'Rechazada', cls: 'bg-red-100 text-red-700' }
    };
    const badgeInterv = (e) => { const x = ESTADOS_INTERV[e || 'pendiente']; return `<span class="badge ${x.cls}">${x.txt}</span>`; };

    const esOficina = () => estado.usuario && ['coordinador','administrador'].includes(estado.usuario.rol);
    const esConductor = () => estado.usuario && estado.usuario.rol === 'conductor';
    const esAdministrador = () => estado.usuario && estado.usuario.rol === 'administrador';

    const guardarSesion = (u) => sessionStorage.setItem('ravel_fds_user', JSON.stringify(u));
    const cargarSesion = () => { const s = sessionStorage.getItem('ravel_fds_user'); return s ? JSON.parse(s) : null; };
    const limpiarSesion = () => sessionStorage.removeItem('ravel_fds_user');

    const login = async () => {
      const cedula = $('input-cedula').value.trim();
      const errBox = $('login-error');
      errBox.classList.add('hidden');
      if (!cedula) { errBox.textContent = 'Ingresa tu cédula'; errBox.classList.remove('hidden'); return; }
      try {
        const snap = await getDoc(doc(db, 'usuarios_fds', cedula));
        if (!snap.exists()) { errBox.textContent = 'Cédula no registrada.'; errBox.classList.remove('hidden'); return; }
        const u = snap.data();
        if (u.activo === false) { errBox.textContent = 'Tu usuario está inactivo.'; errBox.classList.remove('hidden'); return; }
        estado.usuario = { cedula, ...u };
        guardarSesion(estado.usuario);
        entrarApp();
      } catch (e) { errBox.textContent = 'Error: ' + e.message; errBox.classList.remove('hidden'); }
    };

    const logout = () => {
      if (estado.unsubPlanillas) estado.unsubPlanillas();
      if (estado.unsubVehiculos) estado.unsubVehiculos();
      if (estado.unsubUsuarios) estado.unsubUsuarios();
      if (estado.unsubClientes) estado.unsubClientes();
      limpiarSesion();
      estado.usuario = null; estado.vista = 'lista';
      $('view-main').classList.add('hidden');
      $('view-login').classList.remove('hidden');
      $('input-cedula').value = '';
    };

    const entrarApp = () => {
      $('view-login').classList.add('hidden');
      $('view-main').classList.remove('hidden');
      $('header-nombre').textContent = estado.usuario.nombre;
      $('header-rol').textContent = estado.usuario.rol;
      estado.vista = 'lista';
      renderNav();
      suscribirVehiculos();
      suscribirPlanillas();
      suscribirUsuarios();
      suscribirClientes();
      navegarA(estado.vista);
    };

    const renderNav = () => {
      const tabs = [];
      if (esConductor()) {
        tabs.push({ id: 'lista', txt: 'Mis planillas' });
        tabs.push({ id: 'nueva', txt: '+ Nueva planilla' });
      } else {
        tabs.push({ id: 'lista', txt: 'Planillas' });
        tabs.push({ id: 'nueva', txt: '+ Nueva planilla' });
        tabs.push({ id: 'aprobaciones', txt: 'Aprobaciones' });
        tabs.push({ id: 'dashboard', txt: 'Dashboard' });
        tabs.push({ id: 'reportes', txt: 'Reportes' });
        tabs.push({ id: 'vehiculos', txt: 'Vehículos' });
      }
      if (esAdministrador()) {
        tabs.push({ id: 'usuarios', txt: 'Usuarios' });
        tabs.push({ id: 'clientes', txt: 'Clientes' });
      }
      $('nav-tabs').innerHTML = tabs.map(t =>
        `<button class="nav-link ${estado.vista === t.id ? 'active' : ''}" data-tab="${t.id}">${esc(t.txt)}</button>`
      ).join('');
      $('nav-tabs').querySelectorAll('[data-tab]').forEach(b => {
        b.onclick = () => {
          if (b.dataset.tab === 'nueva') iniciarNuevaPlanilla();
          else navegarA(b.dataset.tab);
        };
      });
    };

    const navegarA = (vista) => {
      // Guardia: conductor solo puede acceder a lista y planilla
      const vistasRestringidas = ['aprobaciones','dashboard','reportes','vehiculos','usuarios','clientes'];
      if (esConductor() && vistasRestringidas.includes(vista)) {
        vista = 'lista';
      }
      estado.vista = vista;
      if (vista !== 'planilla') estado.planillaEditando = null;
      renderNav();
      render();
    };

    const suscribirVehiculos = () => {
      const q = query(collection(db, 'vehiculos_fds'), orderBy('placa'));
      estado.unsubVehiculos = onSnapshot(q, (snap) => {
        estado.vehiculos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        if (['vehiculos','planilla'].includes(estado.vista)) render();
      });
    };

    const suscribirPlanillas = () => {
      const q = query(collection(db, 'servicios_fds'), orderBy('fecha', 'desc'));
      estado.unsubPlanillas = onSnapshot(q, (snap) => {
        estado.planillas = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        // Si está editando una planilla, actualízala con la versión nueva
        if (estado.planillaEditando) {
          const upd = estado.planillas.find(p => p.id === estado.planillaEditando.id);
          if (upd) estado.planillaEditando = upd;
        }
        render();
      });
    };

    const suscribirUsuarios = () => {
      const q = query(collection(db, 'usuarios_fds'), orderBy('nombre'));
      estado.unsubUsuarios = onSnapshot(q, (snap) => {
        estado.usuarios = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        if (['usuarios','planilla'].includes(estado.vista)) render();
      });
    };

    const suscribirClientes = () => {
      const q = query(collection(db, 'clientes_fds'), orderBy('nombre'));
      estado.unsubClientes = onSnapshot(q, (snap) => {
        estado.clientes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        if (estado.vista === 'clientes') render();
      });
    };

    const render = () => {
      const c = $('content');
      switch (estado.vista) {
        case 'lista': c.innerHTML = renderLista(); afterRenderLista(); break;
        case 'planilla': c.innerHTML = renderPlanilla(); afterRenderPlanilla(); break;
        case 'aprobaciones': c.innerHTML = renderAprobaciones(); afterRenderAprobaciones(); break;
        case 'dashboard': c.innerHTML = renderDashboard(); afterRenderDashboard(); break;
        case 'reportes': c.innerHTML = renderReportes(); afterRenderReportes(); break;
        case 'vehiculos': c.innerHTML = renderVehiculos(); afterRenderVehiculos(); break;
        case 'usuarios': c.innerHTML = renderUsuarios(); afterRenderUsuarios(); break;
        case 'clientes': c.innerHTML = renderClientes(); afterRenderClientes(); break;
      }
    };

    // ===== Nueva planilla =====
    const iniciarNuevaPlanilla = () => {
      abrirModal(`
        <h2 class="text-lg font-semibold mb-3">Nueva planilla del día</h2>
        <div class="space-y-3">
          <div><label class="label">Fecha</label><input id="np-fecha" type="date" class="input" value="${fechaHoy()}" /></div>
          <div>
            <label class="label">Vehículo</label>
            <select id="np-placa" class="input">
              <option value="">— Seleccionar —</option>
              ${(() => {
                const vehiculosDisp = estado.vehiculos.filter(v => v.activo !== false);
                if (esConductor() && estado.usuario.placaAsignada) {
                  // Conductor: solo su placa asignada
                  const v = vehiculosDisp.find(v => v.placa === estado.usuario.placaAsignada);
                  return v ? `<option value="${esc(v.placa)}" selected>${esc(v.placa)} — ${esc(v.tipo || '')}</option>` : '<option disabled>Sin placa asignada</option>';
                }
                return vehiculosDisp.map(v =>
                  `<option value="${esc(v.placa)}">${esc(v.placa)} — ${esc(v.tipo || '')} ${v.origen ? `(${esc(v.origen)})` : ''}</option>`
                ).join('');
              })()}
            </select>
          </div>
          <div>
            <label class="label">Cliente</label>
            <select id="np-cliente" class="input">
              <option value="">— Seleccionar cliente —</option>
              ${estado.clientes.filter(c => c.activo !== false).map(c =>
                `<option value="${esc(c.id)}" data-nombre="${esc(c.nombre)}">${esc(c.nombre)}</option>`
              ).join('')}
            </select>
          </div>
          <div><label class="label">Hora de inicio de operación</label><input id="np-hi" type="time" class="input" /></div>
          <div class="text-xs text-gray-500">Las intervenciones se agregan después dentro de la planilla.</div>
        </div>
        <div class="grid grid-cols-2 gap-2 mt-4">
          <button class="btn btn-ghost" data-action="np-cancelar">Cancelar</button>
          <button class="btn btn-primary" data-action="np-crear">Crear planilla</button>
        </div>
      `);
      document.querySelector('[data-action="np-cancelar"]').onclick = cerrarModal;
      document.querySelector('[data-action="np-crear"]').onclick = crearPlanilla;
    };

    const crearPlanilla = async () => {
      const fecha = $('np-fecha').value;
      const placa = $('np-placa').value;
      const hi = $('np-hi').value;
      const clienteSel = $('np-cliente');
      const clienteId = clienteSel ? clienteSel.value : '';
      const clienteNombre = clienteSel && clienteSel.selectedIndex > 0
        ? clienteSel.options[clienteSel.selectedIndex].dataset.nombre || clienteSel.options[clienteSel.selectedIndex].text
        : '';
      if (!fecha || !placa || !hi) return alert('Completa todos los campos');
      const idPlanilla = `${fecha}_${placa}`;
      const existing = await getDoc(doc(db, 'servicios_fds', idPlanilla));
      if (existing.exists()) {
        if (!confirm(`Ya existe una planilla para ${placa} el ${fecha}. ¿Abrirla?`)) return;
        cerrarModal();
        estado.planillaEditando = { id: idPlanilla, ...existing.data() };
        navegarA('planilla');
        return;
      }
      const payload = {
        fecha, placa,
        clienteId, clienteNombre,
        horaInicioOperacion: hi, horaFinOperacion: '',
        estado: 'en_curso',
        intervenciones: [],
        diaSemana: diaSemana(fecha),
        creadoPorCedula: estado.usuario.cedula,
        creadoPorNombre: estado.usuario.nombre,
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      };
      try {
        await setDoc(doc(db, 'servicios_fds', idPlanilla), payload);
        cerrarModal();
        estado.planillaEditando = { id: idPlanilla, ...payload };
        navegarA('planilla');
      } catch (e) { alert('Error: ' + e.message); }
    };

    // ===== Lista =====
    const renderLista = () => {
      const lista = esConductor()
        ? estado.planillas.filter(p =>
            p.creadoPorCedula === estado.usuario.cedula ||
            (p.intervenciones || []).some(i => i.cedulaConductor === estado.usuario.cedula)
          )
        : estado.planillas;
      let html = `
        <div class="flex items-center justify-between mb-3">
          <h1 class="text-lg font-semibold">Planillas</h1>
          <button class="btn btn-primary text-sm" data-action="nueva-planilla">+ Nueva</button>
        </div>
      `;
      if (lista.length === 0) {
        html += `<div class="card text-center text-gray-500 py-8">Aún no hay planillas registradas.<br><span class="text-sm">Crea una con el botón "+ Nueva".</span></div>`;
      } else {
        html += '<div class="space-y-2">';
        lista.forEach(p => {
          const n = (p.intervenciones || []).length;
          html += `
            <div class="card cursor-pointer hover:bg-gray-50" data-planilla="${esc(p.id)}">
              <div class="flex items-center justify-between mb-1">
                <div class="font-medium">${esc(p.placa)} · ${esc(p.diaSemana || '')} ${esc(p.fecha)}</div>
                ${badgeEstado(p.estado)}
              </div>
              ${p.clienteNombre ? `<div class="text-xs text-blue-700 font-medium mb-1">📋 ${esc(p.clienteNombre)}</div>` : ''}
              <div class="text-sm text-gray-600">Inicio: ${esc(p.horaInicioOperacion || '--:--')}${p.horaFinOperacion ? ` · Fin: ${esc(p.horaFinOperacion)}` : ''}</div>
              <div class="text-xs text-gray-500 mt-1">${n} ${n === 1 ? 'intervención' : 'intervenciones'}</div>
            </div>
          `;
        });
        html += '</div>';
      }
      return html;
    };

    const afterRenderLista = () => {
      document.querySelector('[data-action="nueva-planilla"]').onclick = iniciarNuevaPlanilla;
      document.querySelectorAll('[data-planilla]').forEach(el => {
        el.onclick = () => {
          estado.planillaEditando = estado.planillas.find(p => p.id === el.dataset.planilla);
          navegarA('planilla');
        };
      });
    };

    // ===== Planilla individual =====
    const renderPlanilla = () => {
      const p = estado.planillaEditando;
      if (!p) return '<div class="card">Planilla no encontrada.</div>';
      const intervs = p.intervenciones || [];
      const puedeEditar = p.estado === 'en_curso';
      return `
        <div class="max-w-md mx-auto space-y-3">
          <div class="card">
            <div class="flex items-center justify-between mb-3">
              <div>
                <div class="text-xs text-gray-500 uppercase tracking-wide">Planilla</div>
                <div class="font-semibold">${esc(p.placa)} · ${esc(p.diaSemana || '')} ${esc(p.fecha)}</div>
                ${p.clienteNombre ? `<div class="text-sm text-blue-700 font-medium mt-0.5">📋 ${esc(p.clienteNombre)}</div>` : ''}
              </div>
              ${badgeEstado(p.estado)}
            </div>
            <div class="grid grid-cols-2 gap-3 text-sm">
              <div>
                <div class="text-xs text-gray-500">Inicio operación</div>
                ${puedeEditar
                  ? `<input id="pl-hi" type="time" class="input mt-1" value="${esc(p.horaInicioOperacion || '')}" />`
                  : `<div class="font-medium mt-1">${esc(p.horaInicioOperacion || '--:--')}</div>`}
              </div>
              <div>
                <div class="text-xs text-gray-500">Fin operación</div>
                ${puedeEditar
                  ? `<input id="pl-hf" type="time" class="input mt-1" value="${esc(p.horaFinOperacion || '')}" />`
                  : `<div class="font-medium mt-1">${esc(p.horaFinOperacion || '--:--')}</div>`}
              </div>
            </div>
            ${p.horaInicioOperacion && p.horaFinOperacion ? `
              <div class="mt-2 text-xs text-gray-500">Jornada total: ${fmtMin(diffMin(p.horaInicioOperacion, p.horaFinOperacion))}</div>
            ` : ''}
            ${p.comentarioAprobacion ? `
              <div class="bg-red-50 border border-red-200 rounded-lg p-3 text-sm mt-3">
                <div class="text-xs font-semibold text-red-700 uppercase mb-1">Comentario oficina</div>
                <div class="text-red-700">${esc(p.comentarioAprobacion)}</div>
              </div>
            ` : ''}
          </div>

          <div class="card">
            <div class="flex items-center justify-between mb-3">
              <div class="font-semibold">Intervenciones (${intervs.length})</div>
              ${puedeEditar ? `<button class="btn btn-primary text-sm" data-action="add-interv">+ Agregar</button>` : ''}
            </div>
            ${intervs.length === 0 ? '<div class="text-center text-gray-500 py-4 text-sm">Sin intervenciones aún.</div>' : ''}
            <div class="space-y-2">
              ${intervs.map((iv, idx) => {
                const esEfectivo = iv.resultadoConductor === 'efectivo';
                const esFallido = iv.resultadoConductor === 'fallido';
                const colorBorde = esEfectivo ? 'bg-green-50 border-green-300' : esFallido ? 'bg-red-50 border-red-300' : 'bg-white border-gray-200';
                return `
                  <div class="border rounded-lg p-3 ${colorBorde}">
                    <div class="flex items-center justify-between mb-1">
                      <div class="text-sm font-medium">#${idx + 1} · ${esc(iv.horaLlegada || '--')} → ${esc(iv.horaSalida || '--')} <span class="text-gray-500">(${fmtMin(diffMin(iv.horaLlegada, iv.horaSalida))})</span></div>
                      <div class="flex items-center gap-1">
                        ${esEfectivo ? '<span class="text-green-700 text-xs font-semibold">✔ Efectivo</span>' : ''}
                        ${esFallido ? '<span class="text-red-700 text-xs font-semibold">✘ Fallido</span>' : ''}
                        ${badgeInterv(iv.estado)}
                      </div>
                    </div>
                    <div class="text-sm text-gray-700">📍 ${esc(iv.ubicacion || '—')} — ${esc(iv.lugarAtendido || '—')}</div>
                    <div class="text-xs text-gray-500 mt-1">👤 ${esc(iv.nombreConductor || '—')}</div>
                    ${iv.observaciones ? `<div class="text-xs text-gray-600 mt-1 italic">"${esc(iv.observaciones)}"</div>` : ''}
                    ${esFallido && iv.motivoFallo ? `<div class="text-xs text-red-700 mt-1 font-medium">Motivo: ${esc(iv.motivoFallo)}</div>` : ''}
                    ${iv.comentarioRechazo ? `<div class="text-xs text-red-700 mt-1">Rechazo oficina: ${esc(iv.comentarioRechazo)}</div>` : ''}
                    ${puedeEditar ? `
                      <div class="flex items-center gap-3 mt-2 flex-wrap">
                        <button class="text-blue-700 text-xs font-medium" data-edit-iv="${idx}">✏️ Editar</button>
                        <button class="text-red-600 text-xs font-medium" data-del-iv="${idx}">🗑 Borrar</button>
                        ${!esEfectivo ? `<button class="text-green-700 text-xs font-semibold border border-green-400 rounded px-2 py-0.5" data-efectivo-iv="${idx}">✔ Efectivo</button>` : ''}
                        ${!esFallido ? `<button class="text-red-700 text-xs font-semibold border border-red-400 rounded px-2 py-0.5" data-fallido-iv="${idx}">✘ Fallido</button>` : ''}
                        ${(esEfectivo || esFallido) ? `<button class="text-gray-500 text-xs border border-gray-300 rounded px-2 py-0.5" data-limpiar-iv="${idx}">↩ Quitar</button>` : ''}
                      </div>
                    ` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <button class="btn btn-ghost" data-action="volver">Volver</button>
            ${puedeEditar ? `
              <button class="btn btn-ok" data-action="cerrar-dia">Cerrar día</button>
            ` : ''}
          </div>
          ${puedeEditar ? `
            <button class="btn w-full mt-1 bg-red-100 text-red-700 hover:bg-red-200 border border-red-300" data-action="cancelar-planilla">
              Cancelar servicio del día
            </button>
          ` : ''}
        </div>
      `;
    };

    const afterRenderPlanilla = () => {
      const p = estado.planillaEditando;
      if (!p) return;
      document.querySelector('[data-action="volver"]').onclick = () => navegarA('lista');
      const addBtn = document.querySelector('[data-action="add-interv"]');
      if (addBtn) addBtn.onclick = () => abrirModalIntervencion(null, null);

      // Editar intervención
      document.querySelectorAll('[data-edit-iv]').forEach(b => b.onclick = () => {
        const idx = parseInt(b.dataset.editIv);
        abrirModalIntervencion(p.intervenciones[idx], idx);
      });

      // Borrar intervención
      document.querySelectorAll('[data-del-iv]').forEach(b => b.onclick = async () => {
        const idx = parseInt(b.dataset.delIv);
        if (!confirm('¿Borrar esta intervención?')) return;
        const nuevas = (p.intervenciones || []).filter((_, i) => i !== idx);
        await updateDoc(doc(db, 'servicios_fds', p.id), { intervenciones: nuevas, updatedAt: serverTimestamp() });
      });

      // Marcar Efectivo
      document.querySelectorAll('[data-efectivo-iv]').forEach(b => b.onclick = async () => {
        const idx = parseInt(b.dataset.efectivoIv);
        const nuevas = [...(p.intervenciones || [])];
        nuevas[idx] = { ...nuevas[idx], resultadoConductor: 'efectivo', motivoFallo: '' };
        await updateDoc(doc(db, 'servicios_fds', p.id), { intervenciones: nuevas, updatedAt: serverTimestamp() });
      });

      // Marcar Fallido — abre modal para obligar motivo
      document.querySelectorAll('[data-fallido-iv]').forEach(b => b.onclick = () => {
        const idx = parseInt(b.dataset.fallidoIv);
        abrirModal(`
          <h2 class="text-lg font-semibold mb-3">Servicio fallido</h2>
          <p class="text-sm text-gray-600 mb-3">Describe por qué no se pudo prestar el servicio.</p>
          <label class="label">Motivo del fallo <span class="text-red-600">*</span></label>
          <textarea id="motivo-fallo" rows="3" class="input" placeholder="Ej: El cliente no se presentó, vehículo no arrancó, dirección incorrecta..."></textarea>
          <div class="grid grid-cols-2 gap-2 mt-4">
            <button class="btn btn-ghost" id="btn-fallo-cancelar">Cancelar</button>
            <button class="btn bg-red-600 text-white hover:bg-red-700" id="btn-fallo-guardar">Confirmar fallo</button>
          </div>
        `);
        $('btn-fallo-cancelar').onclick = cerrarModal;
        $('btn-fallo-guardar').onclick = async () => {
          const motivo = $('motivo-fallo').value.trim();
          if (!motivo) return alert('El motivo es obligatorio para marcar un servicio como fallido.');
          const nuevas = [...(p.intervenciones || [])];
          nuevas[idx] = { ...nuevas[idx], resultadoConductor: 'fallido', motivoFallo: motivo };
          await updateDoc(doc(db, 'servicios_fds', p.id), { intervenciones: nuevas, updatedAt: serverTimestamp() });
          cerrarModal();
        };
      });

      // Quitar resultado (vuelve a sin marcar)
      document.querySelectorAll('[data-limpiar-iv]').forEach(b => b.onclick = async () => {
        const idx = parseInt(b.dataset.limpiarIv);
        const nuevas = [...(p.intervenciones || [])];
        nuevas[idx] = { ...nuevas[idx], resultadoConductor: '', motivoFallo: '' };
        await updateDoc(doc(db, 'servicios_fds', p.id), { intervenciones: nuevas, updatedAt: serverTimestamp() });
      });

      // Horas
      const hi = $('pl-hi'), hf = $('pl-hf');
      if (hi) hi.onchange = async () => {
        await updateDoc(doc(db, 'servicios_fds', p.id), { horaInicioOperacion: hi.value, updatedAt: serverTimestamp() });
      };
      if (hf) hf.onchange = async () => {
        await updateDoc(doc(db, 'servicios_fds', p.id), { horaFinOperacion: hf.value, updatedAt: serverTimestamp() });
      };

      // Cerrar día
      const cerrarBtn = document.querySelector('[data-action="cerrar-dia"]');
      if (cerrarBtn) cerrarBtn.onclick = async () => {
        const horaFin = $('pl-hf')?.value || p.horaFinOperacion;
        if (!horaFin) return alert('Ingresa la hora de fin de operación antes de cerrar el día');
        if ((p.intervenciones || []).length === 0) {
          if (!confirm('No has registrado ninguna intervención. ¿Cerrar el día de todos modos?')) return;
        }
        if (!confirm('¿Cerrar el día y enviar para aprobación? No podrás editar después.')) return;
        await updateDoc(doc(db, 'servicios_fds', p.id), {
          horaFinOperacion: horaFin,
          estado: 'por_aprobar',
          updatedAt: serverTimestamp()
        });
        navegarA('lista');
      };

      // Cancelar servicio del día
      const cancelarBtn = document.querySelector('[data-action="cancelar-planilla"]');
      if (cancelarBtn) cancelarBtn.onclick = async () => {
        if (!confirm('¿Cancelar el servicio del día? La planilla quedará marcada como cancelada.')) return;
        abrirModal(`
          <h2 class="text-lg font-semibold mb-3">Motivo de cancelación</h2>
          <p class="text-sm text-gray-600 mb-3">¿Por qué se cancela el servicio del día?</p>
          <label class="label">Motivo <span class="text-red-600">*</span></label>
          <textarea id="motivo-cancelacion" rows="3" class="input" placeholder="Ej: Vehículo averiado, cliente canceló, fuerza mayor..."></textarea>
          <div class="grid grid-cols-2 gap-2 mt-4">
            <button class="btn btn-ghost" id="btn-mc-cancelar">Volver</button>
            <button class="btn bg-red-600 text-white hover:bg-red-700" id="btn-mc-confirmar">Cancelar servicio</button>
          </div>
        `);
        $('btn-mc-cancelar').onclick = cerrarModal;
        $('btn-mc-confirmar').onclick = async () => {
          const motivo = $('motivo-cancelacion').value.trim();
          if (!motivo) return alert('Debes escribir el motivo de cancelación.');
          await updateDoc(doc(db, 'servicios_fds', p.id), {
            estado: 'cancelado',
            motivoCancelacion: motivo,
            canceladoPor: estado.usuario.nombre,
            updatedAt: serverTimestamp()
          });
          cerrarModal();
          navegarA('lista');
        };
      };
    };

    // ===== Modal intervención =====
    const abrirModalIntervencion = (iv, idx) => {
      const datos = iv || {
        cedulaConductor: estado.usuario.rol === 'conductor' ? estado.usuario.cedula : '',
        nombreConductor: estado.usuario.rol === 'conductor' ? estado.usuario.nombre : '',
        horaLlegada: '', horaSalida: '', ubicacion: '', lugarAtendido: '', observaciones: '', estado: 'pendiente'
      };
      const conductores = estado.usuarios.filter(u => u.activo !== false);
      abrirModal(`
        <h2 class="text-lg font-semibold mb-3">${idx != null ? 'Editar' : 'Nueva'} intervención</h2>
        <div class="space-y-3">
          <div>
            <label class="label">Conductor</label>
            <select id="iv-cond" class="input">
              <option value="">— Seleccionar —</option>
              ${conductores.map(c => `
                <option value="${esc(c.cedula || c.id)}" ${datos.cedulaConductor === (c.cedula || c.id) ? 'selected' : ''}>
                  ${esc(c.nombre)} (${esc(c.cedula || c.id)})
                </option>
              `).join('')}
            </select>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div><label class="label">H. Llegada</label><input id="iv-hl" type="time" class="input" value="${esc(datos.horaLlegada)}" /></div>
            <div><label class="label">H. Salida</label><input id="iv-hs" type="time" class="input" value="${esc(datos.horaSalida)}" /></div>
          </div>
          <div>
            <label class="label">Ubicación</label>
            <div class="flex gap-2">
              <input id="iv-ubi" type="text" class="input flex-1" placeholder="Ej: Bello, Antioquia" value="${esc(datos.ubicacion)}" />
              <button class="btn btn-ghost text-xs whitespace-nowrap" data-action="iv-gps">📍 GPS</button>
            </div>
            <div id="iv-gps-info" class="text-xs text-gray-500 mt-1">${datos.gps ? `GPS: ${datos.gps.lat?.toFixed(5)}, ${datos.gps.lng?.toFixed(5)}` : ''}</div>
          </div>
          <div><label class="label">Lugar atendido</label><input id="iv-lug" type="text" class="input" placeholder="Ej: Subestación Niquía" value="${esc(datos.lugarAtendido)}" /></div>
          <div><label class="label">Observaciones (opcional)</label><textarea id="iv-obs" class="input" style="min-height: 50px;">${esc(datos.observaciones || '')}</textarea></div>
        </div>
        <div class="grid grid-cols-2 gap-2 mt-4">
          <button class="btn btn-ghost" data-action="iv-cancelar">Cancelar</button>
          <button class="btn btn-primary" data-action="iv-guardar">Guardar</button>
        </div>
      `);
      let _gps = datos.gps || null;
      document.querySelector('[data-action="iv-gps"]').onclick = () => {
        if (!navigator.geolocation) return alert('GPS no disponible');
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            _gps = { lat: pos.coords.latitude, lng: pos.coords.longitude, ts: Date.now() };
            $('iv-gps-info').textContent = `GPS: ${_gps.lat.toFixed(5)}, ${_gps.lng.toFixed(5)}`;
          },
          () => alert('No se pudo capturar ubicación')
        );
      };
      document.querySelector('[data-action="iv-cancelar"]').onclick = cerrarModal;
      document.querySelector('[data-action="iv-guardar"]').onclick = async () => {
        const cedCond = $('iv-cond').value;
        const conductor = conductores.find(c => (c.cedula || c.id) === cedCond);
        if (!conductor) return alert('Selecciona un conductor');
        const hl = $('iv-hl').value, hs = $('iv-hs').value;
        if (!hl || !hs) return alert('Completa hora de llegada y salida');
        const ubi = $('iv-ubi').value.trim(), lug = $('iv-lug').value.trim();
        if (!ubi || !lug) return alert('Completa ubicación y lugar atendido');
        const nuevaIv = {
          id: datos.id || uuid(),
          cedulaConductor: conductor.cedula || conductor.id,
          nombreConductor: conductor.nombre,
          horaLlegada: hl, horaSalida: hs,
          ubicacion: ubi, lugarAtendido: lug,
          observaciones: $('iv-obs').value.trim(),
          gps: _gps,
          estado: datos.estado || 'pendiente',
          registradoPor: estado.usuario.cedula,
          registradoEn: Date.now()
        };
        const p = estado.planillaEditando;
        const intervs = [...(p.intervenciones || [])];
        if (idx != null) intervs[idx] = nuevaIv;
        else intervs.push(nuevaIv);
        try {
          await updateDoc(doc(db, 'servicios_fds', p.id), { intervenciones: intervs, updatedAt: serverTimestamp() });
          cerrarModal();
        } catch (e) { alert('Error: ' + e.message); }
      };
    };

    // ===== Aprobaciones =====
    const renderAprobaciones = () => {
      const filtradas = estado.planillas.filter(p => p.estado === estado.filtroEstado);
      return `
        <div class="flex items-center justify-between mb-3">
          <h1 class="text-lg font-semibold">Aprobaciones</h1>
          <select id="filtro-estado" class="input" style="width:auto;font-size:0.875rem;">
            <option value="por_aprobar" ${estado.filtroEstado === 'por_aprobar' ? 'selected' : ''}>Por aprobar</option>
            <option value="aprobado" ${estado.filtroEstado === 'aprobado' ? 'selected' : ''}>Aprobadas</option>
            <option value="rechazado" ${estado.filtroEstado === 'rechazado' ? 'selected' : ''}>Rechazadas</option>
            <option value="en_curso" ${estado.filtroEstado === 'en_curso' ? 'selected' : ''}>En curso</option>
          </select>
        </div>
        <div class="card flex justify-between items-center mb-3">
          <span class="text-sm text-gray-600">Total (${ESTADOS[estado.filtroEstado].txt})</span>
          <span class="text-lg font-semibold">${filtradas.length}</span>
        </div>
        ${filtradas.length === 0 ? '<div class="card text-center text-gray-500 py-8">Sin registros.</div>' : ''}
        <div class="space-y-2">
          ${filtradas.map(p => {
            const intervs = p.intervenciones || [];
            const rech = intervs.filter(i => i.estado === 'rechazada').length;
            return `
              <div class="card">
                <div class="flex items-center justify-between mb-1">
                  <div class="font-medium">${esc(p.placa)} · ${esc(p.diaSemana || '')} ${esc(p.fecha)}</div>
                  ${badgeEstado(p.estado)}
                </div>
                <div class="text-sm text-gray-600">
                  Operación: ${esc(p.horaInicioOperacion || '--')} → ${esc(p.horaFinOperacion || '--')} · ${intervs.length} intervenciones
                  ${rech > 0 ? ` · <span class="text-red-700">${rech} rechazadas</span>` : ''}
                </div>
                <button class="btn btn-ghost text-sm mt-3 w-full" data-revisar="${esc(p.id)}">Ver y revisar</button>
              </div>
            `;
          }).join('')}
        </div>
      `;
    };

    const afterRenderAprobaciones = () => {
      $('filtro-estado').onchange = (e) => { estado.filtroEstado = e.target.value; render(); };
      document.querySelectorAll('[data-revisar]').forEach(b => b.onclick = () =>
        abrirModalRevision(estado.planillas.find(p => p.id === b.dataset.revisar))
      );
    };

    const abrirModalRevision = (p) => {
      const intervs = JSON.parse(JSON.stringify(p.intervenciones || []));
      const draw = () => {
        $('modal-content').innerHTML = `
          <h2 class="text-lg font-semibold mb-1">Revisar planilla</h2>
          <div class="text-sm text-gray-600 mb-3">${esc(p.placa)} · ${esc(p.diaSemana || '')} ${esc(p.fecha)} · Operación: ${esc(p.horaInicioOperacion)} → ${esc(p.horaFinOperacion || '--')}</div>
          <div class="space-y-2 mb-3 max-h-96 overflow-y-auto">
            ${intervs.map((iv, idx) => `
              <div class="border rounded-lg p-2 text-sm ${iv.estado === 'rechazada' ? 'bg-red-50' : iv.estado === 'ok' ? 'bg-green-50' : ''}">
                <div class="flex items-center justify-between">
                  <div class="text-xs font-medium">#${idx + 1} · ${esc(iv.horaLlegada)} → ${esc(iv.horaSalida)}</div>
                  ${badgeInterv(iv.estado)}
                </div>
                <div class="text-xs mt-1">${esc(iv.ubicacion)} — ${esc(iv.lugarAtendido)}</div>
                <div class="text-xs text-gray-500">${esc(iv.nombreConductor)}</div>
                ${iv.observaciones ? `<div class="text-xs text-gray-600 italic">"${esc(iv.observaciones)}"</div>` : ''}
                ${iv.comentarioRechazo ? `<div class="text-xs text-red-700">Motivo: ${esc(iv.comentarioRechazo)}</div>` : ''}
                <div class="flex gap-3 mt-2">
                  <button class="text-green-700 text-xs" data-ok="${idx}">Marcar OK</button>
                  <button class="text-red-700 text-xs" data-rech="${idx}">Rechazar</button>
                  <button class="text-gray-500 text-xs" data-pend="${idx}">Sin revisar</button>
                </div>
              </div>
            `).join('')}
          </div>
          <div class="text-xs text-gray-500 mb-3">Al "Aprobar planilla" las rechazadas quedan así; las demás pasan a OK.</div>
          <div class="grid grid-cols-3 gap-2">
            <button class="btn btn-ghost" data-action="rev-cerrar">Cerrar</button>
            <button class="btn btn-err" data-action="rev-rech-todo">Rechazar todo</button>
            <button class="btn btn-ok" data-action="rev-aprobar">Aprobar</button>
          </div>
        `;
        ligar();
      };
      const ligar = () => {
        document.querySelectorAll('[data-ok]').forEach(b => b.onclick = () => {
          intervs[+b.dataset.ok].estado = 'ok';
          intervs[+b.dataset.ok].comentarioRechazo = '';
          draw();
        });
        document.querySelectorAll('[data-rech]').forEach(b => b.onclick = () => {
          const c = prompt('Motivo del rechazo:'); if (c == null) return;
          intervs[+b.dataset.rech].estado = 'rechazada';
          intervs[+b.dataset.rech].comentarioRechazo = c;
          draw();
        });
        document.querySelectorAll('[data-pend]').forEach(b => b.onclick = () => {
          intervs[+b.dataset.pend].estado = 'pendiente';
          intervs[+b.dataset.pend].comentarioRechazo = '';
          draw();
        });
        document.querySelector('[data-action="rev-cerrar"]').onclick = cerrarModal;
        document.querySelector('[data-action="rev-rech-todo"]').onclick = async () => {
          const c = prompt('Motivo del rechazo de TODA la planilla:'); if (c == null) return;
          intervs.forEach(iv => { iv.estado = 'rechazada'; iv.comentarioRechazo = c; });
          await updateDoc(doc(db, 'servicios_fds', p.id), {
            estado: 'rechazado', comentarioAprobacion: c, intervenciones: intervs,
            aprobadoPorCedula: estado.usuario.cedula, aprobadoPorNombre: estado.usuario.nombre,
            fechaAprobacion: serverTimestamp()
          });
          cerrarModal();
        };
        document.querySelector('[data-action="rev-aprobar"]').onclick = async () => {
          intervs.forEach(iv => { if (iv.estado !== 'rechazada') iv.estado = 'ok'; });
          await updateDoc(doc(db, 'servicios_fds', p.id), {
            estado: 'aprobado', intervenciones: intervs,
            aprobadoPorCedula: estado.usuario.cedula, aprobadoPorNombre: estado.usuario.nombre,
            fechaAprobacion: serverTimestamp()
          });
          cerrarModal();
        };
      };
      abrirModal('');
      draw();
    };

    // ===== Dashboard =====
    const renderDashboard = () => {
      if (!estado.dashDesde) estado.dashDesde = fechaHaceDias(30);
      if (!estado.dashHasta) estado.dashHasta = fechaHoy();
      const filt = estado.planillas.filter(p => p.fecha >= estado.dashDesde && p.fecha <= estado.dashHasta);
      const tot = filt.length;
      const aprob = filt.filter(p => p.estado === 'aprobado').length;
      const porAp = filt.filter(p => p.estado === 'por_aprobar').length;
      const enC = filt.filter(p => p.estado === 'en_curso').length;
      const rech = filt.filter(p => p.estado === 'rechazado').length;
      let totIv = 0, ivOk = 0, ivRech = 0, minIv = 0, minJor = 0;
      const porCond = {}, porVeh = {}, porUbi = {};
      filt.forEach(p => {
        const iv = p.intervenciones || [];
        totIv += iv.length;
        ivOk += iv.filter(i => i.estado === 'ok').length;
        ivRech += iv.filter(i => i.estado === 'rechazada').length;
        iv.forEach(i => {
          minIv += diffMin(i.horaLlegada, i.horaSalida) || 0;
          if (i.nombreConductor) porCond[i.nombreConductor] = (porCond[i.nombreConductor] || 0) + 1;
          if (i.ubicacion) porUbi[i.ubicacion] = (porUbi[i.ubicacion] || 0) + 1;
        });
        if (p.placa) porVeh[p.placa] = (porVeh[p.placa] || 0) + 1;
        if (p.horaInicioOperacion && p.horaFinOperacion) minJor += diffMin(p.horaInicioOperacion, p.horaFinOperacion) || 0;
      });
      const pct = tot ? Math.round((aprob/tot)*100) : 0;
      const rkC = Object.entries(porCond).sort((a,b)=>b[1]-a[1]).slice(0,5);
      const rkV = Object.entries(porVeh).sort((a,b)=>b[1]-a[1]).slice(0,5);
      const rkU = Object.entries(porUbi).sort((a,b)=>b[1]-a[1]).slice(0,5);
      const kpi = (l,v,e='',c='') => `<div class="card"><div class="text-xs text-gray-500 uppercase tracking-wide">${l}</div><div class="text-2xl font-semibold mt-1 ${c}">${v}${e?`<span class="text-sm text-gray-500 ml-2">${e}</span>`:''}</div></div>`;
      const rk = (t, items) => `<div class="card"><div class="font-semibold mb-2">${t}</div>${items.length===0?'<div class="text-sm text-gray-500">Sin datos</div>':''}${items.map(([k,v])=>`<div class="flex justify-between py-1 text-sm border-b last:border-0"><span>${esc(k)}</span><span class="font-medium">${v}</span></div>`).join('')}</div>`;
      return `
        <h1 class="text-lg font-semibold mb-3">Dashboard</h1>
        <div class="card grid grid-cols-2 gap-3 mb-3">
          <div><label class="label">Desde</label><input id="dash-desde" type="date" class="input" value="${estado.dashDesde}" /></div>
          <div><label class="label">Hasta</label><input id="dash-hasta" type="date" class="input" value="${estado.dashHasta}" /></div>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3">
          ${kpi('Planillas', tot)}
          ${kpi('Aprobadas', aprob, `${pct}%`)}
          ${kpi('Por aprobar', porAp, '', 'text-amber-700')}
          ${kpi('En curso', enC, '', 'text-blue-700')}
          ${kpi('Total intervenc.', totIv)}
          ${kpi('Interv. OK', ivOk)}
          ${kpi('Interv. rechaz.', ivRech, '', 'text-red-700')}
          ${kpi('Rechazadas', rech, '', 'text-red-700')}
        </div>
        <div class="grid grid-cols-2 gap-3 mb-3">
          ${kpi('Horas intervención', fmtMin(minIv))}
          ${kpi('Horas jornada', fmtMin(minJor))}
        </div>
        <div class="grid md:grid-cols-3 gap-3">
          ${rk('Top conductores', rkC)}
          ${rk('Top vehículos', rkV)}
          ${rk('Top ubicaciones', rkU)}
        </div>
      `;
    };

    const afterRenderDashboard = () => {
      $('dash-desde').onchange = (e) => { estado.dashDesde = e.target.value; render(); };
      $('dash-hasta').onchange = (e) => { estado.dashHasta = e.target.value; render(); };
    };

    // ===== Reportes =====
    const renderReportes = () => {
      if (!estado.repDesde) estado.repDesde = fechaHaceDias(30);
      if (!estado.repHasta) estado.repHasta = fechaHoy();

      // Construir lista de placas disponibles (de planillas + vehiculos)
      const placasSet = new Set();
      estado.vehiculos.forEach(v => v.activo !== false && placasSet.add(v.placa));
      estado.planillas.forEach(p => placasSet.add(p.placa));
      const placas = Array.from(placasSet).sort();

      // Filtrar planillas según criterios
      const filt = estado.planillas.filter(p => {
        if (p.fecha < estado.repDesde || p.fecha > estado.repHasta) return false;
        if (estado.repPlaca !== '__ALL__' && p.placa !== estado.repPlaca) return false;
        return true;
      }).sort((a,b) => a.fecha.localeCompare(b.fecha) || a.placa.localeCompare(b.placa));

      // Calcular totales
      let totIv = 0, minJor = 0, minIv = 0;
      filt.forEach(p => {
        const iv = p.intervenciones || [];
        totIv += iv.length;
        iv.forEach(i => { minIv += diffMin(i.horaLlegada, i.horaSalida) || 0; });
        if (p.horaInicioOperacion && p.horaFinOperacion) minJor += diffMin(p.horaInicioOperacion, p.horaFinOperacion) || 0;
      });

      const previewRows = filt.slice(0, 20).map(p => {
        const iv = (p.intervenciones || []).length;
        const jorMin = (p.horaInicioOperacion && p.horaFinOperacion) ? diffMin(p.horaInicioOperacion, p.horaFinOperacion) : null;
        return `
          <tr class="border-b">
            <td class="py-2 px-2 text-sm">${esc(p.fecha)}</td>
            <td class="py-2 px-2 text-sm">${esc(p.diaSemana || '')}</td>
            <td class="py-2 px-2 text-sm font-medium">${esc(p.placa)}</td>
            <td class="py-2 px-2 text-sm">${esc(p.horaInicioOperacion || '--')}</td>
            <td class="py-2 px-2 text-sm">${esc(p.horaFinOperacion || '--')}</td>
            <td class="py-2 px-2 text-sm text-center">${iv}</td>
            <td class="py-2 px-2 text-sm">${fmtMin(jorMin)}</td>
            <td class="py-2 px-2 text-sm">${badgeEstado(p.estado)}</td>
          </tr>
        `;
      }).join('');

      return `
        <h1 class="text-lg font-semibold mb-3">Reportes</h1>
        <div class="card mb-3">
          <div class="grid md:grid-cols-3 gap-3">
            <div>
              <label class="label">Placa</label>
              <select id="rep-placa" class="input">
                <option value="__ALL__" ${estado.repPlaca === '__ALL__' ? 'selected' : ''}>— Todas las placas —</option>
                ${placas.map(pl => `<option value="${esc(pl)}" ${estado.repPlaca === pl ? 'selected' : ''}>${esc(pl)}</option>`).join('')}
              </select>
            </div>
            <div><label class="label">Desde</label><input id="rep-desde" type="date" class="input" value="${estado.repDesde}" /></div>
            <div><label class="label">Hasta</label><input id="rep-hasta" type="date" class="input" value="${estado.repHasta}" /></div>
          </div>
          <div class="grid grid-cols-3 gap-3 mt-4 pt-4 border-t">
            <div class="text-center"><div class="text-xs text-gray-500 uppercase">Planillas</div><div class="text-2xl font-semibold">${filt.length}</div></div>
            <div class="text-center"><div class="text-xs text-gray-500 uppercase">Intervenciones</div><div class="text-2xl font-semibold">${totIv}</div></div>
            <div class="text-center"><div class="text-xs text-gray-500 uppercase">Horas jornada</div><div class="text-2xl font-semibold">${fmtMin(minJor)}</div></div>
          </div>
          <button id="btn-descargar-rep" class="btn btn-primary w-full mt-4" ${filt.length === 0 ? 'disabled' : ''}>
            ${filt.length === 0 ? 'No hay planillas en el rango' : `📥 Descargar Excel (${filt.length} planillas)`}
          </button>
        </div>

        ${filt.length > 0 ? `
          <div class="card">
            <div class="font-semibold mb-3">Previsualización ${filt.length > 20 ? `(primeras 20 de ${filt.length})` : ''}</div>
            <div class="overflow-x-auto">
              <table class="w-full text-sm">
                <thead class="bg-gray-50">
                  <tr>
                    <th class="text-left py-2 px-2">Fecha</th>
                    <th class="text-left py-2 px-2">Día</th>
                    <th class="text-left py-2 px-2">Placa</th>
                    <th class="text-left py-2 px-2">Inicio</th>
                    <th class="text-left py-2 px-2">Fin</th>
                    <th class="text-center py-2 px-2"># Interv.</th>
                    <th class="text-left py-2 px-2">Jornada</th>
                    <th class="text-left py-2 px-2">Estado</th>
                  </tr>
                </thead>
                <tbody>${previewRows}</tbody>
              </table>
            </div>
          </div>
        ` : ''}
      `;
    };

    const afterRenderReportes = () => {
      $('rep-placa').onchange = (e) => { estado.repPlaca = e.target.value; render(); };
      $('rep-desde').onchange = (e) => { estado.repDesde = e.target.value; render(); };
      $('rep-hasta').onchange = (e) => { estado.repHasta = e.target.value; render(); };
      const btn = $('btn-descargar-rep');
      if (btn) btn.onclick = descargarReporteExcel;
    };

    const descargarReporteExcel = () => {
      if (typeof XLSX === 'undefined') {
        alert('La librería de Excel no está cargada. Revisa tu conexión y recarga la página.');
        return;
      }

      const filt = estado.planillas.filter(p => {
        if (p.fecha < estado.repDesde || p.fecha > estado.repHasta) return false;
        if (estado.repPlaca !== '__ALL__' && p.placa !== estado.repPlaca) return false;
        return true;
      }).sort((a,b) => a.fecha.localeCompare(b.fecha) || a.placa.localeCompare(b.placa));

      if (filt.length === 0) { alert('No hay planillas en el rango seleccionado'); return; }

      const placaLabel = estado.repPlaca === '__ALL__' ? 'TODAS' : estado.repPlaca;
      const esTodas = estado.repPlaca === '__ALL__';

      // Ordenar: si es todas → primero por placa, luego por fecha; si es una → solo por fecha
      filt.sort((a,b) => esTodas
        ? a.placa.localeCompare(b.placa) || a.fecha.localeCompare(b.fecha)
        : a.fecha.localeCompare(b.fecha)
      );

      const aoa = [];
      // Encabezado general
      aoa.push(['REPORTE SERVICIOS TRANSPORTES RAVEL']);
      aoa.push([`PERIODO: ${estado.repDesde} a ${estado.repHasta}`]);
      aoa.push([`PLACA: ${placaLabel}`]);
      const clientesUnicos = [...new Set(filt.map(p => p.clienteNombre).filter(Boolean))];
      aoa.push([`CLIENTE: ${clientesUnicos.length > 0 ? clientesUnicos.join(', ') : '—'}`]);
      aoa.push([`GENERADO POR: ${estado.usuario.nombre}`]);
      aoa.push([]);

      const CABECERA = ['FECHA', 'INICIO JORNADA', 'FIN JORNADA', 'CONDUCTOR', 'LLEGA', 'SALIDA', 'UBICACIÓN', 'LUGAR ATENDIDO', 'RESULTADO', 'MOTIVO FALLO', 'ESTADO PLANILLA', 'MOTIVO CANCELACIÓN'];

      const escribirFilasPlanilla = (p) => {
        const iv = p.intervenciones || [];
        const esCancelada = p.estado === 'cancelado';
        const estadoLabel = ESTADOS[p.estado] ? ESTADOS[p.estado].txt : p.estado;
        if (esCancelada) {
          aoa.push([p.fecha, p.horaInicioOperacion || '', p.horaFinOperacion || '', '', '', '', '', '', '', '', 'CANCELADO', p.motivoCancelacion || '']);
        } else if (iv.length === 0) {
          aoa.push([p.fecha, p.horaInicioOperacion || '', p.horaFinOperacion || '', '', '', '', '', '', '', '', estadoLabel, '']);
        } else {
          iv.forEach(i => {
            const resultado = i.resultadoConductor === 'efectivo' ? 'EFECTIVO'
                            : i.resultadoConductor === 'fallido'  ? 'FALLIDO' : '';
            aoa.push([
              p.fecha,
              p.horaInicioOperacion || '',
              p.horaFinOperacion || '',
              i.nombreConductor || '',
              i.horaLlegada || '',
              i.horaSalida || '',
              i.ubicacion || '',
              i.lugarAtendido || '',
              resultado,
              i.motivoFallo || '',
              estadoLabel,
              ''
            ]);
          });
        }
      };

      if (esTodas) {
        // Agrupar por placa con bloque separado para cada una
        const porPlaca = {};
        filt.forEach(p => {
          if (!porPlaca[p.placa]) porPlaca[p.placa] = [];
          porPlaca[p.placa].push(p);
        });
        Object.entries(porPlaca).sort(([a],[b]) => a.localeCompare(b)).forEach(([placa, planillas]) => {
          aoa.push([`PLACA: ${placa}`]);
          aoa.push(CABECERA);
          planillas.forEach(p => escribirFilasPlanilla(p));
          aoa.push([]); // línea en blanco entre placas
        });
      } else {
        // Una sola placa: cabecera única y todas las filas
        aoa.push(CABECERA);
        filt.forEach(p => escribirFilasPlanilla(p));
      }

      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws['!cols'] = [
        { wch: 14 },  // FECHA
        { wch: 16 },  // INICIO JORNADA
        { wch: 14 },  // FIN JORNADA
        { wch: 26 },  // CONDUCTOR
        { wch: 10 },  // LLEGA
        { wch: 10 },  // SALIDA
        { wch: 22 },  // UBICACIÓN
        { wch: 28 },  // LUGAR ATENDIDO
        { wch: 12 },  // RESULTADO
        { wch: 35 },  // MOTIVO FALLO
        { wch: 16 },  // ESTADO PLANILLA
        { wch: 35 }   // MOTIVO CANCELACIÓN
      ];

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Reporte');
      const nombreArchivo = `Reporte_Ravel_${placaLabel}_${estado.repDesde}_a_${estado.repHasta}.xlsx`;
      XLSX.writeFile(wb, nombreArchivo);
    };

    // ===== Vehículos =====
    let _vehEditando = null;
    const renderVehiculos = () => {
      const v = _vehEditando || { placa: '', tipo: 'Microbús', origen: 'Propio', propietario: '', activo: true };
      const TIPOS = ['Bus','Microbús','Van','Camioneta','Auto','Otro'];
      const ORIGENES = ['Propio','Tercero','Cliente','Otra línea'];
      return `
        <h1 class="text-lg font-semibold mb-3">Vehículos del servicio</h1>
        <div class="card mb-3">
          <div class="font-semibold mb-3">${_vehEditando ? 'Editar' : 'Agregar'} vehículo</div>
          <div class="grid md:grid-cols-2 gap-3">
            <div><label class="label">Placa</label><input id="v-placa" class="input" value="${esc(v.placa)}" ${_vehEditando ? 'disabled' : ''} placeholder="EQX123" /></div>
            <div><label class="label">Tipo</label><select id="v-tipo" class="input">${TIPOS.map(t => `<option ${v.tipo === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
            <div><label class="label">Origen</label><select id="v-origen" class="input">${ORIGENES.map(o => `<option ${v.origen === o ? 'selected' : ''}>${o}</option>`).join('')}</select></div>
            <div><label class="label">Propietario</label><input id="v-prop" class="input" value="${esc(v.propietario || '')}" /></div>
            <div class="flex items-center gap-2 md:col-span-2">
              <input id="v-activo" type="checkbox" ${v.activo !== false ? 'checked' : ''} />
              <label for="v-activo" class="text-sm">Activo</label>
            </div>
          </div>
          <div class="flex gap-2 mt-3">
            <button class="btn btn-primary" data-action="v-guardar">${_vehEditando ? 'Actualizar' : 'Agregar'}</button>
            ${_vehEditando ? '<button class="btn btn-ghost" data-action="v-cancelar">Cancelar</button>' : ''}
          </div>
        </div>
        <div class="card">
          <div class="font-semibold mb-2">Listado (${estado.vehiculos.length})</div>
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead><tr class="text-left border-b"><th class="py-2">Placa</th><th>Tipo</th><th>Origen</th><th>Propietario</th><th>Estado</th><th></th></tr></thead>
              <tbody>
                ${estado.vehiculos.map(v => `
                  <tr class="border-b last:border-0">
                    <td class="py-2 font-medium">${esc(v.placa)}</td>
                    <td>${esc(v.tipo || '')}</td>
                    <td>${esc(v.origen || '')}</td>
                    <td class="text-gray-600">${esc(v.propietario || '—')}</td>
                    <td><span class="badge ${v.activo !== false ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'}">${v.activo !== false ? 'Activo' : 'Inactivo'}</span></td>
                    <td class="text-right whitespace-nowrap">
                      <button class="text-blue-700 text-xs mr-2" data-veh-edit="${esc(v.id)}">Editar</button>
                      <button class="text-red-700 text-xs" data-veh-del="${esc(v.id)}">Eliminar</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    };

    const afterRenderVehiculos = () => {
      document.querySelector('[data-action="v-guardar"]').onclick = guardarVehiculo;
      const cancelBtn = document.querySelector('[data-action="v-cancelar"]');
      if (cancelBtn) cancelBtn.onclick = () => { _vehEditando = null; render(); };
      document.querySelectorAll('[data-veh-edit]').forEach(b => b.onclick = () => {
        _vehEditando = estado.vehiculos.find(x => x.id === b.dataset.vehEdit);
        render();
      });
      document.querySelectorAll('[data-veh-del]').forEach(b => b.onclick = async () => {
        if (!confirm('¿Eliminar este vehículo?')) return;
        await deleteDoc(doc(db, 'vehiculos_fds', b.dataset.vehDel));
      });
    };

    const guardarVehiculo = async () => {
      const placa = $('v-placa').value.trim().toUpperCase().replace(/\s/g, '');
      if (!placa) return alert('Placa requerida');
      const payload = { placa, tipo: $('v-tipo').value, origen: $('v-origen').value, propietario: $('v-prop').value.trim(), activo: $('v-activo').checked };
      try {
        await setDoc(doc(db, 'vehiculos_fds', placa), payload);
        _vehEditando = null;
        render();
      } catch (e) { alert('Error: ' + e.message); }
    };

    // ===== Usuarios =====
    let _userEditando = null;
    const renderUsuarios = () => {
      const u = _userEditando || { cedula: '', nombre: '', telefono: '', rol: 'conductor', placaAsignada: '', activo: true };
      const ROLES = ['conductor','coordinador','administrador'];
      const esCond = (u.rol || 'conductor') === 'conductor';
      return `
        <h1 class="text-lg font-semibold mb-3">Usuarios</h1>
        <div class="card mb-3">
          <div class="font-semibold mb-3">${_userEditando ? 'Editar' : 'Agregar'} usuario</div>
          <div class="grid md:grid-cols-2 gap-3">
            <div><label class="label">Cédula</label><input id="u-cedula" class="input" value="${esc(u.cedula || u.id || '')}" ${_userEditando ? 'disabled' : ''} inputmode="numeric" /></div>
            <div><label class="label">Nombre completo</label><input id="u-nombre" class="input" value="${esc(u.nombre)}" /></div>
            <div><label class="label">Teléfono</label><input id="u-tel" class="input" value="${esc(u.telefono || '')}" inputmode="tel" /></div>
            <div>
              <label class="label">Rol</label>
              <select id="u-rol" class="input" onchange="document.getElementById('u-placa-wrap').style.display=this.value==='conductor'?'block':'none'">
                ${ROLES.map(r => `<option ${u.rol === r ? 'selected' : ''}>${r}</option>`).join('')}
              </select>
            </div>
            <div id="u-placa-wrap" style="display:${esCond ? 'block' : 'none'}">
              <label class="label">Placa asignada</label>
              <select id="u-placa" class="input">
                <option value="">— Sin placa asignada —</option>
                ${estado.vehiculos.filter(v => v.activo !== false).map(v =>
                  `<option value="${esc(v.placa)}" ${u.placaAsignada === v.placa ? 'selected' : ''}>${esc(v.placa)} — ${esc(v.tipo || '')}</option>`
                ).join('')}
              </select>
            </div>
            <div class="flex items-center gap-2 md:col-span-2">
              <input id="u-activo" type="checkbox" ${u.activo !== false ? 'checked' : ''} />
              <label for="u-activo" class="text-sm">Activo</label>
            </div>
          </div>
          <div class="flex gap-2 mt-3">
            <button class="btn btn-primary" data-action="u-guardar">${_userEditando ? 'Actualizar' : 'Agregar'}</button>
            ${_userEditando ? '<button class="btn btn-ghost" data-action="u-cancelar">Cancelar</button>' : ''}
          </div>
        </div>
        <div class="card">
          <div class="font-semibold mb-2">Usuarios (${estado.usuarios.length})</div>
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead><tr class="text-left border-b"><th class="py-2">Cédula</th><th>Nombre</th><th>Teléfono</th><th>Rol</th><th>Placa</th><th>Estado</th><th></th></tr></thead>
              <tbody>
                ${estado.usuarios.map(u => `
                  <tr class="border-b last:border-0">
                    <td class="py-2 font-medium">${esc(u.cedula || u.id)}</td>
                    <td>${esc(u.nombre)}</td>
                    <td class="text-gray-600">${esc(u.telefono || '—')}</td>
                    <td><span class="badge bg-blue-100 text-blue-700 capitalize">${esc(u.rol)}</span></td>
                    <td class="font-medium">${u.placaAsignada ? `<span class="badge bg-slate-100 text-slate-700">${esc(u.placaAsignada)}</span>` : '<span class="text-gray-400 text-xs">—</span>'}</td>
                    <td><span class="badge ${u.activo !== false ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'}">${u.activo !== false ? 'Activo' : 'Inactivo'}</span></td>
                    <td class="text-right"><button class="text-blue-700 text-xs" data-user-edit="${esc(u.id)}">Editar</button></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    };

    const afterRenderUsuarios = () => {
      document.querySelector('[data-action="u-guardar"]').onclick = guardarUsuario;
      const cancelBtn = document.querySelector('[data-action="u-cancelar"]');
      if (cancelBtn) cancelBtn.onclick = () => { _userEditando = null; render(); };
      document.querySelectorAll('[data-user-edit]').forEach(b => b.onclick = () => {
        _userEditando = estado.usuarios.find(x => x.id === b.dataset.userEdit);
        render();
      });
    };

    const guardarUsuario = async () => {
      const cedula = $('u-cedula').value.trim();
      const nombre = $('u-nombre').value.trim();
      if (!cedula || !nombre) return alert('Cédula y nombre obligatorios');
      const rol = $('u-rol').value;
      const placaAsignada = rol === 'conductor' ? ($('u-placa')?.value || '') : '';
      const payload = { cedula, nombre, telefono: $('u-tel').value.trim(), rol, placaAsignada, activo: $('u-activo').checked };
      try {
        await setDoc(doc(db, 'usuarios_fds', cedula), payload);
        _userEditando = null;
        render();
      } catch (e) { alert('Error: ' + e.message); }
    };

    // ===== Clientes (solo administrador) =====
    let _clienteEditando = null;
    const renderClientes = () => {
      const c = _clienteEditando || { nombre: '', contacto: '', telefono: '', activo: true };
      return `
        <h1 class="text-lg font-semibold mb-3">Clientes</h1>
        <div class="card mb-3">
          <div class="font-semibold mb-3">${_clienteEditando ? 'Editar' : 'Agregar'} cliente</div>
          <div class="grid md:grid-cols-2 gap-3">
            <div><label class="label">Nombre del cliente</label><input id="cl-nombre" class="input" value="${esc(c.nombre)}" placeholder="Ej: Colegio San Ignacio" /></div>
            <div><label class="label">Persona de contacto</label><input id="cl-contacto" class="input" value="${esc(c.contacto || '')}" placeholder="Nombre del contacto" /></div>
            <div><label class="label">Teléfono</label><input id="cl-tel" class="input" value="${esc(c.telefono || '')}" placeholder="3001234567" /></div>
            <div class="flex items-center gap-2 mt-4">
              <input id="cl-activo" type="checkbox" ${c.activo !== false ? 'checked' : ''} />
              <label class="text-sm">Cliente activo</label>
            </div>
          </div>
          <div class="flex gap-2 mt-3">
            ${_clienteEditando ? `<button class="btn btn-ghost" data-action="cl-cancelar">Cancelar</button>` : ''}
            <button class="btn btn-primary" data-action="cl-guardar">${_clienteEditando ? 'Actualizar' : 'Agregar cliente'}</button>
          </div>
        </div>
        <div class="card">
          <div class="font-semibold mb-3">Clientes registrados (${estado.clientes.length})</div>
          ${estado.clientes.length === 0
            ? '<div class="text-sm text-gray-500">Aún no hay clientes. Agrega el primero arriba.</div>'
            : `<table class="w-full text-sm">
                <thead class="bg-gray-50">
                  <tr>
                    <th class="text-left py-2 px-2">Nombre</th>
                    <th class="text-left py-2 px-2">Contacto</th>
                    <th class="text-left py-2 px-2">Teléfono</th>
                    <th class="text-center py-2 px-2">Estado</th>
                    <th class="py-2 px-2"></th>
                  </tr>
                </thead>
                <tbody>
                  ${estado.clientes.map(cl => `
                    <tr class="border-t">
                      <td class="py-2 px-2 font-medium">${esc(cl.nombre)}</td>
                      <td class="py-2 px-2 text-gray-600">${esc(cl.contacto || '—')}</td>
                      <td class="py-2 px-2 text-gray-600">${esc(cl.telefono || '—')}</td>
                      <td class="py-2 px-2 text-center">
                        <span class="badge ${cl.activo !== false ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'}">
                          ${cl.activo !== false ? 'Activo' : 'Inactivo'}
                        </span>
                      </td>
                      <td class="py-2 px-2 text-right">
                        <button class="text-blue-600 text-xs" data-cl-edit="${esc(cl.id)}">Editar</button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>`
          }
        </div>
      `;
    };

    const afterRenderClientes = () => {
      document.querySelector('[data-action="cl-guardar"]').onclick = guardarCliente;
      const cancelBtn = document.querySelector('[data-action="cl-cancelar"]');
      if (cancelBtn) cancelBtn.onclick = () => { _clienteEditando = null; render(); };
      document.querySelectorAll('[data-cl-edit]').forEach(b => b.onclick = () => {
        _clienteEditando = estado.clientes.find(x => x.id === b.dataset.clEdit);
        render();
      });
    };

    const guardarCliente = async () => {
      const nombre = $('cl-nombre').value.trim();
      if (!nombre) return alert('El nombre del cliente es obligatorio');
      const payload = {
        nombre,
        contacto: $('cl-contacto').value.trim(),
        telefono: $('cl-tel').value.trim(),
        activo: $('cl-activo').checked
      };
      try {
        if (_clienteEditando) {
          await updateDoc(doc(db, 'clientes_fds', _clienteEditando.id), payload);
        } else {
          await addDoc(collection(db, 'clientes_fds'), payload);
        }
        _clienteEditando = null;
        render();
      } catch (e) { alert('Error: ' + e.message); }
    };

    // ===== Modal helpers =====
    const abrirModal = (html) => { $('modal-content').innerHTML = html; $('modal').classList.remove('hidden'); };
    const cerrarModal = () => { $('modal').classList.add('hidden'); $('modal-content').innerHTML = ''; };

    // ===== Init =====
    $('btn-login').onclick = login;
    $('input-cedula').onkeydown = (e) => { if (e.key === 'Enter') login(); };
    $('btn-logout').onclick = logout;

    const sesion = cargarSesion();
    if (sesion) { estado.usuario = sesion; entrarApp(); }
  </script>
</body>
</html>
